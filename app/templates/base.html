<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lancer3D Tasks{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0F1117',
                        surface: '#1A1D27',
                        card: '#21253A',
                        accent: '#6C63FF',
                        danger: '#FF4D6A',
                        success: '#1DD1A1',
                        'text-primary': '#F0F0F5',
                        'text-muted': '#7B7E99',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F1117; color: #F0F0F5; }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="fixed top-4 right-4 z-50 space-y-2" id="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-msg px-4 py-3 rounded-lg text-sm font-medium shadow-lg
                        {% if category == 'danger' %}bg-red-500 text-white
                        {% elif category == 'success' %}bg-emerald-500 text-white
                        {% elif category == 'warning' %}bg-amber-500 text-white
                        {% else %}bg-indigo-500 text-white{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            <script>
                setTimeout(() => {
                    document.querySelectorAll('.flash-msg').forEach(el => {
                        el.style.transition = 'opacity 0.5s';
                        el.style.opacity = '0';
                        setTimeout(() => el.remove(), 500);
                    });
                }, 4000);
            </script>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
